<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공연 조명 구상안</title>
    <!-- 모바일 및 PC 직접 PDF 변환을 위한 html2pdf 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-color: #F5F5F7;
            --card-bg: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #6E6E73;
            --border-color: #C5C5CE;
            --accent-color: #0071E3;
            --accent-hover: #0077ED;
            --danger-color: #FF3B30;
            --radius-sm: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 💡 카카오톡/인앱 브라우저 안내 배너 */
        .browser-notice {
            background: #FFF8E1;
            border: 1px solid #FFC107;
            border-radius: var(--radius-sm);
            padding: 7px 12px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 11.5px;
        }

        .browser-notice span.icon {
            font-size: 14px;
            flex-shrink: 0;
        }

        .browser-notice-content {
            line-height: 1.35;
            color: #5D4037;
            font-weight: 500;
        }

        .browser-notice-content strong {
            color: #D32F2F;
            font-weight: 700;
        }

        /* Card Style */
        .card {
            background: var(--card-bg);
            border: 1px solid #B0B0B8;
            border-radius: 8px;
            padding: 12px 14px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        /* 상단 개요 */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        @media (max-width: 640px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group-box {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 7px 9px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .input-group-box label {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .input-field {
            background: #FAFAFC;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px 7px;
            font-size: 12.5px;
            color: var(--text-primary);
            outline: none;
            width: 100%;
        }

        .input-field:focus {
            background: #FFFFFF;
            border-color: var(--accent-color);
        }

        textarea.input-field {
            resize: none;
            min-height: 26px;
            line-height: 1.35;
            overflow: hidden;
            display: block;
        }

        /* 직접 입력 래퍼 */
        .custom-form-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-revert-select {
            background: #E8E8ED;
            border: none;
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 10.5px;
            padding: 4px 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Table Area */
        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            min-width: 560px;
        }

        th {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: left;
            padding: 6px 5px;
            border-bottom: 1.5px solid var(--text-primary);
        }

        td {
            padding: 6px 5px;
            border-bottom: 1px solid #E0E0E5;
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Example Row styling */
        tr.example-row {
            background-color: rgba(255, 204, 0, 0.08);
        }

        .example-badge {
            display: inline-block;
            background-color: #FFCC00;
            color: #1D1D1F;
            font-size: 9.5px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 3px;
            margin-bottom: 3px;
        }

        /* 행 조작 버튼 */
        .row-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .move-btns {
            display: flex;
            gap: 2px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 10px;
        }

        .btn-icon:hover {
            background-color: #E8E8ED;
            color: var(--text-primary);
        }

        .btn-icon.delete:hover {
            background-color: rgba(255, 59, 48, 0.1);
            color: var(--danger-color);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .export-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 14px;
            font-size: 12.5px;
            font-weight: 600;
            border-radius: 980px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #FFFFFF;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #E8E8ED;
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: #DDDDED;
        }

        /* PDF 출력 전용 뷰 (평소엔 숨김) */
        .print-view {
            display: none;
        }

        /* PDF 캡처 모드 스타일 (불필요한 빈 공간 없이 자연스럽게 페이지 나눔) */
        .pdf-export-mode {
            background: #FFFFFF !important;
            padding: 0 !important;
            margin: 0 !important;
            max-width: 100% !important;
            width: 100% !important;
            gap: 6px !important;
        }

        .pdf-export-mode .card {
            box-shadow: none !important;
            border: 1px solid #8E8E93 !important;
            border-radius: 4px !important;
            padding: 8px 10px !important;
            background: #FFFFFF !important;
        }

        .pdf-export-mode .header-row {
            margin-bottom: 4px !important;
        }

        .pdf-export-mode .header-title {
            font-size: 14px !important;
        }

        .pdf-export-mode .info-grid {
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 5px !important;
        }

        .pdf-export-mode .input-group-box {
            border: 1px solid #6E6E73 !important;
            border-radius: 4px !important;
            background: #FFFFFF !important;
            padding: 4px 6px !important;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }

        .pdf-export-mode .input-group-box label {
            color: #000000 !important;
            font-size: 10px !important;
        }

        .pdf-export-mode .browser-notice,
        .pdf-export-mode .btn-group,
        .pdf-export-mode .row-actions,
        .pdf-export-mode .example-row,
        .pdf-export-mode .action-col,
        .pdf-export-mode .btn-revert-select,
        .pdf-export-mode .input-field {
            display: none !important;
        }

        .pdf-export-mode .table-container {
            overflow: visible !important;
        }

        .pdf-export-mode table {
            min-width: 100% !important;
            width: 100% !important;
            table-layout: fixed !important;
        }

        .pdf-export-mode thead {
            display: table-header-group !important;
        }

        .pdf-export-mode th {
            font-size: 10.5px !important;
            padding: 4px 3px !important;
            border-bottom: 1.5px solid #000 !important;
        }

        .pdf-export-mode td {
            padding: 4px 3px !important;
        }

        .pdf-export-mode tr {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }

        .pdf-export-mode .print-view {
            display: block !important;
            border: none !important;
            padding: 1px 2px !important;
            background: #FFFFFF !important;
            font-size: 10.5px !important;
            line-height: 1.3 !important;
            width: 100% !important;
            white-space: pre-wrap !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            color: #1D1D1F !important;
        }

        /* 브라우저 인쇄(@media print) 스타일 */
        @media print {
            @page {
                size: A4 portrait;
                margin: 8mm;
            }
            body {
                background: #FFFFFF !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .container {
                max-width: 100% !important;
                width: 100% !important;
                gap: 6px !important;
            }
            .card {
                box-shadow: none !important;
                border: 1px solid #8E8E93 !important;
                border-radius: 4px !important;
                padding: 8px 10px !important;
                background: #FFFFFF !important;
            }
            .header-row {
                margin-bottom: 4px !important;
            }
            .header-title {
                font-size: 14px !important;
            }
            .info-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 5px !important;
            }
            .input-group-box {
                border: 1px solid #6E6E73 !important;
                border-radius: 4px !important;
                background: #FFFFFF !important;
                padding: 4px 6px !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            .input-group-box label {
                color: #000000 !important;
                font-size: 10px !important;
            }
            .browser-notice,
            .btn-group,
            .row-actions,
            .example-row,
            .action-col,
            .btn-revert-select,
            .input-field {
                display: none !important;
            }
            .table-container {
                overflow: visible !important;
            }
            table {
                min-width: 100% !important;
                width: 100% !important;
                table-layout: fixed !important;
            }
            thead {
                display: table-header-group !important;
            }
            th {
                font-size: 10.5px !important;
                padding: 4px 3px !important;
                border-bottom: 1.5px solid #000 !important;
            }
            td {
                padding: 4px 3px !important;
            }
            tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            .print-view {
                display: block !important;
                border: none !important;
                padding: 1px 2px !important;
                background: #FFFFFF !important;
                font-size: 10.5px !important;
                line-height: 1.3 !important;
                width: 100% !important;
                white-space: pre-wrap !important;
                word-break: break-word !important;
                overflow-wrap: break-word !important;
                color: #1D1D1F !important;
            }
        }
    </style>
</head>
<body>

<div class="container" id="capture-area">
    
    <!-- 💡 카카오톡 / 인앱 브라우저 접속 안내 배너 -->
    <div class="browser-notice">
        <span class="icon">⚠️</span>
        <div class="browser-notice-content">
            <strong>모바일(카카오톡·인라인) 브라우저 이용 시 주의사항</strong><br>
            PDF 다운로드가 원활하지 않거나 저장 안 됨 현상이 발생할 수 있습니다. 
            그럴 경우 우측 하단/상단 메뉴 버튼을 눌러 <strong>[다른 브라우저(사파리 / 크롬)로 열기]</strong>를 진행한 뒤 다운로드해 주세요!
        </div>
    </div>

    <!-- 상단 개요 카드 -->
    <div class="card">
        <div class="header-row">
            <h1 class="header-title">조명 연출 구상안</h1>
        </div>
        <div class="info-grid">
            <div class="input-group-box">
                <label>곡명</label>
                <textarea id="song-title" class="input-field" placeholder="예: 첫사랑 (First Love)" oninput="resizeTextarea(this)"></textarea>
                <div class="print-view"></div>
            </div>
            <div class="input-group-box">
                <label>팀명</label>
                <textarea id="team-name" class="input-field" placeholder="예: 루시드 밴드" oninput="resizeTextarea(this)"></textarea>
                <div class="print-view"></div>
            </div>
            <div class="input-group-box">
                <label>의상 컨셉</label>
                <textarea class="input-field" placeholder="예: 화이트 앤 데님 (색상 위주 작성)" oninput="resizeTextarea(this)"></textarea>
                <div class="print-view"></div>
            </div>
            <div class="input-group-box">
                <label>전체 메인 컨셉 & 메인 컬러</label>
                <textarea class="input-field" placeholder="예: Deep Blue & Warm White" oninput="resizeTextarea(this)"></textarea>
                <div class="print-view"></div>
            </div>
        </div>
    </div>

    <!-- 하단 상세 테이블 카드 -->
    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 18%;">송폼 (Song Form)</th>
                        <th style="width: 40%;">가사 (주요 파트)</th>
                        <th style="width: 42%;">희망하는 조명 연출</th>
                        <th class="action-col" style="width: 0%; display: none;">순서/삭제</th>
                    </tr>
                </thead>
                <tbody id="lighting-tbody">
                    <!-- 예시 전용 행 (인쇄/PDF 시 DOM에서 임시 제거되어 출력 제외) -->
                    <tr class="example-row" id="example-row">
                        <td>
                            <span class="example-badge">예시 (출력 제외)</span>
                            <input type="text" class="input-field" value="Intro" oninput="saveExampleData()">
                        </td>
                        <td>
                            <textarea class="input-field" oninput="resizeTextarea(this); saveExampleData()">(드럼 카운트 후 기타 리프 시작/기악 곡일 시 마디 수만 적어주셔도 됩니다.)</textarea>
                        </td>
                        <td>
                            <textarea class="input-field" oninput="resizeTextarea(this); saveExampleData()">무대는 전체 암전 상태에서 보컬 쪽으로 웜화이트 핀조명(Spot)만 은은하게 켜짐. 몽환적인 느낌 유지를 위해 백라이트 딥블루 서서히 페이드인.</textarea>
                        </td>
                        <td class="action-col" style="text-align: center; vertical-align: middle; display: none;">
                            <span style="font-size: 11px; color: var(--text-secondary);">고정</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-secondary" onclick="addRow()">+ 섹션 추가</button>
            <div class="export-btns">
                <button type="button" class="btn btn-secondary" onclick="handleNativePrint()">인쇄 창 열기</button>
                <button type="button" id="btn-download-pdf" class="btn btn-primary" onclick="downloadPDF()">PDF 파일 다운로드</button>
            </div>
        </div>
    </div>
</div>

<script>
    const songForms = ['Intro', 'Verse 1', 'Verse 2', 'Pre-Chorus', 'Chorus 1', 'Chorus 2', 'Interlude', 'Bridge', 'Outro', '직접 입력'];

    // Textarea 높이 자동 조절
    function resizeTextarea(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = (el.scrollHeight) + 'px';
    }

    // 예시 데이터 로컬 저장
    function saveExampleData() {
        const row = document.getElementById('example-row');
        if (!row) return;
        const inputs = row.querySelectorAll('input, textarea');
        const data = {
            form: inputs[0].value,
            lyric: inputs[1].value,
            memo: inputs[2].value
        };
        localStorage.setItem('lighting_example_data', JSON.stringify(data));
    }

    // 저장된 예시 데이터 불러오기
    function loadExampleData() {
        const saved = localStorage.getItem('lighting_example_data');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                const row = document.getElementById('example-row');
                if (!row) return;
                const inputs = row.querySelectorAll('input, textarea');
                if (data.form !== undefined) inputs[0].value = data.form;
                if (data.lyric !== undefined) inputs[1].value = data.lyric;
                if (data.memo !== undefined) inputs[2].value = data.memo;
            } catch (e) {}
        }
    }

    // 송폼 드롭다운 변경 시 '직접 입력' 처리
    function handleFormSelectChange(selectEl) {
        const td = selectEl.closest('td');
        const customWrapper = td.querySelector('.custom-form-wrapper');
        const customInput = customWrapper.querySelector('input');

        if (selectEl.value === '직접 입력') {
            selectEl.style.display = 'none';
            customWrapper.style.display = 'flex';
            customInput.value = '';
            customInput.focus();
        }
    }

    // '직접 입력'에서 다시 드롭다운으로 복귀
    function revertToSelect(btn) {
        const td = btn.closest('td');
        const selectEl = td.querySelector('select');
        const customWrapper = td.querySelector('.custom-form-wrapper');

        customWrapper.style.display = 'none';
        selectEl.style.display = 'block';
        selectEl.value = 'Verse 1';
    }

    // 새로운 행 생성
    function createRow(data = { form: 'Verse 1', lyric: '', memo: '' }) {
        const tr = document.createElement('tr');
        const isCustom = !songForms.includes(data.form) || data.form === '직접 입력';

        const options = songForms.map(f => 
            `<option value="${f}" ${(f === data.form || (isCustom && f === '직접 입력')) ? 'selected' : ''}>${f}</option>`
        ).join('');

        tr.innerHTML = `
            <td>
                <select class="input-field form-select" onchange="handleFormSelectChange(this)" style="${isCustom ? 'display:none;' : ''}">
                    ${options}
                </select>
                <div class="custom-form-wrapper" style="${isCustom ? 'display:flex;' : 'display:none;'}">
                    <input type="text" class="input-field form-custom-input" placeholder="송폼 입력" value="${isCustom && data.form !== '직접 입력' ? data.form : ''}">
                    <button type="button" class="btn-revert-select" onclick="revertToSelect(this)" title="목록에서 선택">↺</button>
                </div>
                <div class="print-view">${data.form}</div>
            </td>
            <td>
                <textarea class="input-field" placeholder="가사 또는 파트 특징 입력" oninput="resizeTextarea(this)">${data.lyric}</textarea>
                <div class="print-view">${data.lyric}</div>
            </td>
            <td>
                <textarea class="input-field" placeholder="원하는 조명 톤, 무빙 등 연출 구상" oninput="resizeTextarea(this)">${data.memo}</textarea>
                <div class="print-view">${data.memo}</div>
            </td>
            <td class="action-col" style="text-align: center;">
                <div class="row-actions">
                    <div class="move-btns">
                        <button type="button" class="btn-icon" onclick="moveRow(this, -1)" title="위로 이동">▲</button>
                        <button type="button" class="btn-icon" onclick="moveRow(this, 1)" title="아래로 이동">▼</button>
                    </div>
                    <button type="button" class="btn-icon delete" onclick="deleteRow(this)" title="삭제">✕</button>
                </div>
            </td>
        `;

        return tr;
    }

    function addRow() {
        const tbody = document.getElementById('lighting-tbody');
        const newRow = createRow();
        tbody.appendChild(newRow);

        setTimeout(() => {
            newRow.querySelectorAll('textarea').forEach(ta => resizeTextarea(ta));
        }, 10);
    }

    // 행 위/아래 순서 변경
    function moveRow(btn, direction) {
        const tr = btn.closest('tr');
        const tbody = tr.parentNode;

        if (direction === -1) {
            const prev = tr.previousElementSibling;
            if (prev && !prev.classList.contains('example-row')) {
                tbody.insertBefore(tr, prev);
            }
        } else if (direction === 1) {
            const next = tr.nextElementSibling;
            if (next) {
                tbody.insertBefore(next, tr);
            }
        }
    }

    function deleteRow(btn) {
        const row = btn.closest('tr');
        row.remove();
    }

    // 입력값 동기화
    function syncPrintViews() {
        document.querySelectorAll('.info-grid .input-group-box').forEach(box => {
            const textarea = box.querySelector('textarea');
            const printView = box.querySelector('.print-view');
            if (textarea && printView) {
                printView.textContent = textarea.value || ' ';
            }
        });

        document.querySelectorAll('#lighting-tbody tr').forEach(tr => {
            if (tr.classList.contains('example-row')) return;

            const select = tr.querySelector('.form-select');
            const customInput = tr.querySelector('.form-custom-input');
            const textareas = tr.querySelectorAll('textarea');
            const printViews = tr.querySelectorAll('.print-view');

            let formValue = '';
            if (select && select.style.display === 'none' && customInput) {
                formValue = customInput.value || '직접 입력';
            } else if (select) {
                formValue = select.value || '';
            }

            if (printViews[0]) printViews[0].textContent = formValue || ' ';
            if (textareas[0] && printViews[1]) printViews[1].textContent = textareas[0].value || ' ';
            if (textareas[1] && printViews[2]) printViews[2].textContent = textareas[1].value || ' ';
        });
    }

    // 출력 시 예시 행(#example-row)을 DOM에서 확실히 제외하고 복구
    function detachExampleRow() {
        const exampleRow = document.getElementById('example-row');
        if (!exampleRow || !exampleRow.parentNode) return null;
        const parent = exampleRow.parentNode;
        const nextSibling = exampleRow.nextSibling;
        parent.removeChild(exampleRow);
        return { exampleRow, parent, nextSibling };
    }

    function restoreExampleRow(detached) {
        if (!detached || !detached.exampleRow || !detached.parent) return;
        detached.parent.insertBefore(detached.exampleRow, detached.nextSibling);
    }

    // PDF 다운로드
    async function downloadPDF() {
        const btn = document.getElementById('btn-download-pdf');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'PDF 생성 중...';

        syncPrintViews();

        const detached = detachExampleRow();
        const container = document.getElementById('capture-area');
        container.classList.add('pdf-export-mode');

        const songTitle = document.getElementById('song-title').value.trim();
        const teamName = document.getElementById('team-name').value.trim();
        let fileName = '공연_조명_구상안.pdf';
        if (songTitle || teamName) {
            fileName = `${[teamName, songTitle, '조명구상안'].filter(Boolean).join('_')}.pdf`;
        }

        const opt = {
            margin:       [6, 6, 6, 6],
            filename:     fileName,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak:    { mode: ['css', 'legacy'] }
        };

        try {
            await html2pdf().set(opt).from(container).save();
        } catch (err) {
            alert('PDF 자동 다운로드 중 오류가 발생했습니다. [인쇄 창 열기] 버튼을 이용해 주세요.');
            console.error(err);
        } finally {
            container.classList.remove('pdf-export-mode');
            restoreExampleRow(detached);
            btn.disabled = false;
            btn.textContent = originalText;
        }
    }

    function handleNativePrint() {
        syncPrintViews();
        const detached = detachExampleRow();
        const cleanup = () => {
            restoreExampleRow(detached);
            window.removeEventListener('afterprint', cleanup);
        };
        window.addEventListener('afterprint', cleanup);
        window.print();
        setTimeout(cleanup, 1000);
    }

    window.onload = () => {
        loadExampleData();
        document.querySelectorAll('textarea').forEach(ta => resizeTextarea(ta));
        addRow();
    };
</script>
