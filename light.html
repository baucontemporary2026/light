<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공연 조명 구상안</title>
    <style>
        :root {
            --bg-color: #F5F5F7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-primary: #1D1D1F;
            --text-secondary: #6E6E73;
            --border-color: #D1D1D6;
            --accent-color: #0071E3;
            --accent-hover: #0077ED;
            --danger-color: #FF3B30;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Card Style */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow);
        }

        .header-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        /* 상단 개요 - 네모 칸 스타일 */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .input-group-box {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .input-group-box label {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: -0.2px;
        }

        .input-field {
            background: #FAFAFC;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        .input-field:focus {
            background: #FFFFFF;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        /* Table Area */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 8px;
        }

        th {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: left;
            padding: 12px 16px;
            border-bottom: 2px solid var(--text-primary);
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }

        textarea.input-field {
            resize: none;
            min-height: 48px;
            line-height: 1.5;
            overflow: hidden;
            display: block;
            box-sizing: border-box;
        }

        /* Example Row styling */
        tr.example-row {
            background-color: rgba(255, 204, 0, 0.08);
        }

        .example-badge {
            display: inline-block;
            background-color: #FFCC00;
            color: #1D1D1F;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 980px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #E8E8ED;
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: #DDDDED;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: color 0.2s;
        }

        .btn-icon:hover {
            color: var(--danger-color);
        }

        /* 🖨️ PDF / 인쇄 전용 박스 완벽 보장 처리 */
        .print-view {
            display: none;
        }

        @media print {
            body { 
                background: #FFF !important; 
                padding: 0 !important; 
            }
            .container {
                max-width: 100% !important;
                gap: 16px !important;
            }
            .card { 
                box-shadow: none !important; 
                border: 1px solid #B0B0B8 !important; 
                border-radius: 12px !important;
                padding: 20px !important; 
                background: #FFF !important;
            }
            .input-group-box {
                border: 1.5px solid #8E8E93 !important;
                border-radius: 8px !important;
                background: #FFF !important;
                padding: 12px !important;
            }
            .input-group-box label {
                color: #000 !important;
            }
            .btn-group, .btn-icon, .example-row { 
                display: none !important; 
            }
            
            /* 인쇄 시 textarea/input 대신 글자 크기에 맞는 백그라운드 박스로 전환하여 잘림 원천 차단 */
            .input-field {
                display: none !important;
            }

            .print-view {
                display: block !important;
                border: 1px solid #A0A0A5 !important;
                border-radius: 6px !important;
                padding: 8px 10px !important;
                background: #FFF !important;
                font-size: 14px !important;
                line-height: 1.5 !important;
                min-height: 38px !important;
                white-space: pre-wrap !important;
                word-break: break-all !important;
                color: #1D1D1F !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            th {
                border-bottom: 2px solid #000 !important;
            }
            td {
                border-bottom: 1px solid #D1D1D6 !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 상단 개요 카드 -->
    <div class="card">
        <h1 class="header-title">조명 연출 구상안</h1>
        <div class="info-grid">
            <div class="input-group-box">
                <label>곡명</label>
                <input type="text" class="input-field" placeholder="예: 첫사랑 (First Love)">
                <div class="print-view"></div>
            </div>
            <div class="input-group-box">
                <label>팀명</label>
                <input type="text" class="input-field" placeholder="예: 루시드 밴드">
                <div class="print-view"></div>
            </div>
            <div class="input-group-box">
                <label>의상 컨셉</label>
                <input type="text" class="input-field" placeholder="예: 화이트 앤 데님 (깔끔하고 청량한 느낌)">
                <div class="print-view"></div>
            </div>
            <div class="input-group-box">
                <label>전체 메인 컨셉 & 메인 컬러</label>
                <input type="text" class="input-field" placeholder="예: 아련하고 몽환적인 새벽 / 메인: Deep Blue & Warm White">
                <div class="print-view"></div>
            </div>
        </div>
    </div>

    <!-- 하단 상세 테이블 카드 -->
    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 18%;">송폼 (Song Form)</th>
                        <th style="width: 37%;">가사 (주요 파트)</th>
                        <th style="width: 40%;">희망하는 조명 연출</th>
                        <th style="width: 5%;"></th>
                    </tr>
                </thead>
                <tbody id="lighting-tbody">
                    <!-- 예시 전용 행 (인쇄 시 자동 숨김) -->
                    <tr class="example-row">
                        <td>
                            <span class="example-badge">예시</span>
                            <select class="input-field" disabled>
                                <option>Intro</option>
                            </select>
                            <div class="print-view">Intro</div>
                        </td>
                        <td>
                            <textarea class="input-field" readonly>(드럼 카운트 후 기타 리프 시작)</textarea>
                            <div class="print-view">(드럼 카운트 후 기타 리프 시작)</div>
                        </td>
                        <td>
                            <textarea class="input-field" readonly>무대는 전체 암전 상태에서 보컬 쪽으로 웜화이트 핀조명(Spot)만 은은하게 켜짐. 몽환적인 느낌 유지를 위해 백라이트 딥블루 서서히 페이드인.</textarea>
                            <div class="print-view">무대는 전체 암전 상태에서 보컬 쪽으로 웜화이트 핀조명(Spot)만 은은하게 켜짐. 몽환적인 느낌 유지를 위해 백라이트 딥블루 서서히 페이드인.</div>
                        </td>
                        <td style="text-align: center;">
                            <span style="font-size: 11px; color: var(--text-secondary); font-weight: 500;">인쇄 제외</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="btn-group">
            <button class="btn btn-secondary" onclick="addRow()">+ 섹션 추가</button>
            <button class="btn btn-primary" onclick="handlePrint()">PDF / 인쇄하기</button>
        </div>
    </div>
</div>

<script>
    const songForms = ['Intro', 'Verse 1', 'Verse 2', 'Pre-Chorus', 'Chorus 1', 'Chorus 2', 'Interlude', 'Bridge', 'Outro', '직접 입력'];

    function resizeTextarea(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = (el.scrollHeight) + 'px';
    }

    function createRow(data = { form: 'Verse 1', lyric: '', memo: '' }) {
        const tr = document.createElement('tr');
        
        const options = songForms.map(f => 
            `<option value="${f}" ${f === data.form ? 'selected' : ''}>${f}</option>`
        ).join('');

        tr.innerHTML = `
            <td>
                <select class="input-field">${options}</select>
                <div class="print-view">${data.form}</div>
            </td>
            <td>
                <textarea class="input-field" placeholder="가사 또는 파트 특징 입력" oninput="resizeTextarea(this)">${data.lyric}</textarea>
                <div class="print-view">${data.lyric}</div>
            </td>
            <td>
                <textarea class="input-field" placeholder="원하는 조명 톤, 무빙, 분위기 등 연출 구상" oninput="resizeTextarea(this)">${data.memo}</textarea>
                <div class="print-view">${data.memo}</div>
            </td>
            <td style="text-align: center;">
                <button class="btn-icon" onclick="deleteRow(this)" title="삭제">✕</button>
            </td>
        `;

        return tr;
    }

    function addRow() {
        const tbody = document.getElementById('lighting-tbody');
        const newRow = createRow();
        tbody.appendChild(newRow);

        setTimeout(() => {
            newRow.querySelectorAll('textarea').forEach(ta => resizeTextarea(ta));
        }, 10);
    }

    function deleteRow(btn) {
        const row = btn.closest('tr');
        row.remove();
    }

    // PDF/인쇄 출력 시 입력된 텍스트를 print-view 태그에 동기화
    function handlePrint() {
        // 상단 입력값 동기화
        document.querySelectorAll('.info-grid .input-group-box').forEach(box => {
            const input = box.querySelector('input');
            const printView = box.querySelector('.print-view');
            if (input && printView) {
                printView.textContent = input.value || '';
            }
        });

        // 표 내부 입력값 동기화
        document.querySelectorAll('#lighting-tbody tr').forEach(tr => {
            if (tr.classList.contains('example-row')) return;
            
            const select = tr.querySelector('select');
            const textareas = tr.querySelectorAll('textarea');
            const printViews = tr.querySelectorAll('.print-view');

            if (select && printViews[0]) {
                printViews[0].textContent = select.value || '';
            }
            if (textareas[0] && printViews[1]) {
                printViews[1].textContent = textareas[0].value || '';
            }
            if (textareas[1] && printViews[2]) {
                printViews[2].textContent = textareas[1].value || '';
            }
        });

        window.print();
    }

    window.onload = () => {
        document.querySelectorAll('.example-row textarea').forEach(ta => resizeTextarea(ta));
        addRow();
    };
</script>

</body>
</html>
